# nginx'in İKİ görevi var:
#  1) Frontend'in statik dosyalarını sunmak (React build çıktısı)
#  2) REVERSE PROXY: /api/* isteklerini API container'ına iletmek
# Sonuç: tarayıcıya göre site ve API AYNI origin → CORS yok, preflight (OPTIONS) yok.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # nginx sürümünü hata sayfalarında ve "Server" başlığında gösterme (saldırgana bilgi verme).
    server_tokens off;

    # ------------------------------------------------------------------ Güvenlik başlıkları
    # "always": hata cevaplarında (404, 500) da eklensin.
    #
    # Content-Security-Policy: Tarayıcıya "sadece KENDİ origin'imden script/stil yükle" der.
    # Biri sayfaya <script src="https://kotu.site/x.js"> veya inline <script> sokmayı başarsa bile
    # tarayıcı ÇALIŞTIRMAZ. XSS'e karşı en güçlü ikinci savunma hattı (birincisi: React'ın otomatik escape'i).
    # Vite production build'i inline script üretmediği için 'unsafe-inline' gerekmiyor.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Tarayıcı dosya türünü tahmin etmeye çalışmasın (yüklenen bir .txt'nin script gibi çalıştırılmasını önler).
    add_header X-Content-Type-Options "nosniff" always;
    # Sitemiz başka bir sitenin <iframe>'ine gömülemesin (clickjacking). CSP'deki frame-ancestors'ın eski tarayıcı karşılığı.
    add_header X-Frame-Options "DENY" always;
    # Başka siteye giden linklerde tam URL (ve içindeki parametreler) sızmasın.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Kamera, mikrofon, konum gibi tarayıcı özellikleri hiç kullanılmıyor → kapat.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HTTPS'e geçince EKLENECEK (HTTP'de anlamsız; tarayıcıya "bu siteye hep HTTPS ile gel" der):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ------------------------------------------------------------------ API → reverse proxy
    location /api/ {
        # "api": docker-compose'daki servis adı. Docker'ın iç DNS'i onu API container'ının IP'sine çözer.
        proxy_pass http://api:8080;

        # API'nin gerçek istemciyi bilmesi için (ASP.NET Core ForwardedHeaders middleware'i okur):
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $proxy_add_x_forwarded_for: istemcinin gönderdiği X-Forwarded-For'un SONUNA gerçek IP'yi ekler.
        # API sadece en sağdaki değere (ForwardLimit=1) güvenir → istemcinin sahte değerleri işe yaramaz.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # İstemci bağlantıyı kapatınca API'ye giden isteği de kes → API'deki CancellationToken tetiklenir (Aşama 3).
        proxy_ignore_client_abort off;
    }

    # Health endpoint'leri iç kullanım içindir (Docker/orkestratör); internete AÇMIYORUZ.
    location /health/ {
        return 404;
    }

    # ------------------------------------------------------------------ Statik dosyalar
    # Vite, build'de dosya adlarına içerik hash'i ekler (index-CPALuswJ.js). İçerik değişirse AD değişir.
    # Bu yüzden bu dosyalar 1 YIL önbelleğe alınabilir: yeni sürümde tarayıcı zaten yeni adı ister.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # (location içinde add_header kullanınca üstteki başlıklar miras ALINMAZ — nginx tuzağı. Tekrar ekliyoruz.)
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA FALLBACK: /gorevler/5 gibi bir adres doğrudan açılınca (veya yenilenince) sunucuda böyle bir DOSYA yok.
    # Bu satır olmasaydı nginx 404 dönerdi. index.html'i dönüyoruz; yönlendirmeyi React yapar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ASLA önbelleğe alınmasın: yeni sürüm deploy edilince tarayıcı yeni JS dosya adlarını görsün.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # gzip: JS/CSS/JSON'u sıkıştırarak gönder (~%70 daha az veri).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
